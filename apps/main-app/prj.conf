# main-app — M コア (8MP: M7 / 8MM: M4) の製品ファーム。土台 (rpmsg)、キープアライブ、CAN の中継。
# ADC は、機能ごとのファイルとしてここへ移していく。
CONFIG_IPM=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n

# CAN の中継 (can_gw.c)
CONFIG_CAN=y

# コンソールは「RAM + UART4 の tee」(main.c の console_tee_init):
# - RAM console: resource table に trace エントリが自動で載り、Linux から
#   cat /sys/kernel/debug/remoteproc/remoteproc0/trace0 で読める
# - UART4: Linux が死んでいる時・ブート極早期の最後の砦
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3
