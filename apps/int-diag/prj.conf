# adc-test — ADS8688 (ECSPI2 の 2 個目の CS) の疎通確認アプリ。
# Zephyr に ADS8688 ドライバは無い (v4.3 時点で確認済み) ため raw SPI で叩く。
# 値は carrier-board-design.md の ESP32 実績 (SPI 5MHz mode1、8ch×16bit)。
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y

# remoteproc (imx_rproc, 6.12) は .resource_table の無い ELF を start すると
# カーネル Oops → start を書いた ssh セッションごと死ぬ (kmm-yocto pitfalls
# 実測 — 本アプリの開発中にも再踏した)。rpmsg は使わないが、テーブルを ELF に
# 持たせるためだけに OPENAMP_RSC_TABLE を有効化する (can-gw と同じ供給源)。
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n
CONFIG_HEAP_MEM_POOL_SIZE=2048
