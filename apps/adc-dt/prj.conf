# adc-dt — ADS868x ドライバ (zephyr-modules/ads868x) の実機確認。
# Zephyr の samples/drivers/adc/adc_dt 相当: DT の zephyr,user io-channels を
# 標準 ADC API (adc_channel_setup_dt / adc_read_dt / adc_raw_to_millivolts_dt) で読む。
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
# ドライバの LOG_ERR を printk (RAM console) に出す
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# remoteproc (imx_rproc) は .resource_table の無い ELF を start すると Oops する
# (adc-test の prj.conf 参照)。rpmsg は使わないがテーブルのためだけに有効化。
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n
CONFIG_HEAP_MEM_POOL_SIZE=2048
