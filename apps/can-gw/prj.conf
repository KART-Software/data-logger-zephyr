# can-gw — MCP2515 (ECSPI2) ⇄ rpmsg "kart-can" の双方向ゲートウェイ。
# Linux 側は kmm-yocto の kart-rpmsg-can モジュールが bind して rpcan0 を
# 生やす。rpmsg 部は rpmsg-echo と同じ openamp_rsc_table 構成。
CONFIG_IPM=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n

CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_CAN=y

# コンソールは「RAM + UART4 の tee」(main.c の kart_console_tee_init):
# - RAM console: resource table に trace エントリが自動で載り、Linux から
#   cat /sys/kernel/debug/remoteproc/remoteproc0/trace0 でログが読める
# - UART4 (J64): Linux が死んでいる時・ブート極早期の最後の砦として維持
# UART_CONSOLE=n は競合排除 (hook は tee が握る)。chosen zephyr,console は
# tee が UART デバイスを引くために使う
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
# UART4 (J64) に printk/log
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3
