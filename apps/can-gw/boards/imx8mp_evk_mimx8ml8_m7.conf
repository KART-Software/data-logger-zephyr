CONFIG_IPM_IMX_MAX_DATA_SIZE_4=y
# Linux 側の mboxes (fsl,mu) は MU チャネル 1 を使う取り決め (8MM と同じ。
# EVK の rpmsg DTS 系 mboxes = <&mu 0 1 &mu 1 1 &mu 3 1>)。
CONFIG_OPENAMP_RSC_TABLE_IPM_RX_ID=1
CONFIG_OPENAMP_RSC_TABLE_IPM_TX_ID=1

# FlexCAN はビットタイミング自由度が高く、8MM (MCP2515 12MHz) で要った
# CAN_SAMPLE_POINT_MARGIN の緩和は不要
