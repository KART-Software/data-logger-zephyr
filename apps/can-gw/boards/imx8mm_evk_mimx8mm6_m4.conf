CONFIG_IPM_IMX_MAX_DATA_SIZE_4=y
# Linux 側の mboxes (fsl,mu) は MU チャネル 1 を使う取り決め (kart DT)。
# 送受とも MU レジスタ index 1 に合わせる
CONFIG_OPENAMP_RSC_TABLE_IPM_RX_ID=1
CONFIG_OPENAMP_RSC_TABLE_IPM_TX_ID=1

# 12MHz 水晶の MCP2515 HAT では 1Mbps が 6 TQ 一択で sample point 上限 66.7%。
# Zephyr の目標 75% ±5% (CONFIG_CAN_SAMPLE_POINT_MARGIN=50 既定) に入らず
# can_set_bitrate が -ERANGE になるため ±10% に緩和する (66.7% での 1M は
# CANable と E2E 実証済み。init 経路は元々 margin 検査なしで同じ 66.7% を採用
# している)。16MHz/20MHz 系のキャリアボードに移行したらこの緩和は不要 (issue #1)
CONFIG_CAN_SAMPLE_POINT_MARGIN=100
