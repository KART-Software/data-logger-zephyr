# DEBIX Infinity (i.MX8MP) M7 版 adc-test。
# コンソールは RAM console (resource table の trace エントリに載り、Linux から
# cat /sys/kernel/debug/remoteproc/remoteproc0/trace0 で読める)。UART4 (J2 Pin17/19) は
# ADS8688 の配線と隣接するので使わない。
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_SPI_MCUX_ECSPI=y
